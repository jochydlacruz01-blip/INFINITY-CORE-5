name: INFINITY CORE - Publish APK Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. infinity-v0.9.1)'
        required: true
        type: string
      release_name:
        description: 'Release title'
        required: true
        type: string
      prerelease:
        description: 'Mark as prerelease'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: INFINITY-AURORA-NEXT-INTEGRATED

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key
        env:
          INFINITY_KEYSTORE_BASE64: ${{ secrets.INFINITY_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${INFINITY_KEYSTORE_BASE64}"
          printf '%s' "${INFINITY_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/infinity-release.jks"
          chmod 600 "${RUNNER_TEMP}/infinity-release.jks"

      - name: Build signed APKs
        env:
          INFINITY_KEYSTORE_FILE: ${{ runner.temp }}/infinity-release.jks
          INFINITY_KEYSTORE_PASSWORD: ${{ secrets.INFINITY_KEYSTORE_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${INFINITY_KEYSTORE_PASSWORD}"
          test -n "${INFINITY_KEY_ALIAS}"
          test -n "${INFINITY_KEY_PASSWORD}"
          gradle testDebugUnitTest testReleaseUnitTest lintDebug lintRelease assembleDebug assembleRelease --stacktrace

      - name: Verify Release signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "${APK}"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "${APKSIGNER}"
          "${APKSIGNER}" verify --verbose --print-certs "${APK}"

      - name: Prepare release files
        run: |
          set -euo pipefail
          mkdir -p release-files
          cp app/build/outputs/apk/debug/app-debug.apk release-files/INFINITY-CORE-debug.apk
          cp app/build/outputs/apk/release/app-release.apk release-files/INFINITY-CORE-release-signed.apk

      - name: Publish APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_name }}
          prerelease: ${{ inputs.prerelease }}
          files: release-files/*.apk
          fail_on_unmatched_files: true
