name: INFINITY Windows Companion

on:
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/infinity-windows-companion.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infinity-windows-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\windows\Infinity.WindowsCompanion.Tests\Infinity.WindowsCompanion.Tests.csproj

      - name: Build and run Windows security/unit tests (including transfer ACL)
        run: dotnet test .\windows\Infinity.WindowsCompanion.Tests\Infinity.WindowsCompanion.Tests.csproj --configuration Release --no-restore

      - name: Publish Windows x64 companion
        run: dotnet publish .\windows\Infinity.WindowsCompanion\Infinity.WindowsCompanion.csproj --configuration Release --runtime win-x64 --self-contained false --output .\artifacts\infinity-windows-companion

      - name: Upload Windows companion
        uses: actions/upload-artifact@v4
        with:
          name: INFINITY-WINDOWS-COMPANION-win-x64
          path: artifacts/infinity-windows-companion/
          if-no-files-found: error
          retention-days: 14
