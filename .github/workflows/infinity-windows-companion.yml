name: INFINITY Windows Companion

on:
  push:
    branches:
      - INFINITY-PACK-12-WINDOWS-COMPANION
      - INFINITY-PACK-14-REMOTE-FRAME-PIPELINE
    paths:
      - "windows/**"
      - "app/**"
      - ".github/workflows/infinity-windows-companion.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep every independent source verification run; do not replace queued runs for this branch.
  group: infinity-windows-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\windows\Infinity.WindowsCompanion.Tests\Infinity.WindowsCompanion.Tests.csproj

      - name: Build and run Windows security/unit tests (including transfer ACL)
        id: windows_tests
        continue-on-error: true
        run: dotnet test .\\windows\\Infinity.WindowsCompanion.Tests\\Infinity.WindowsCompanion.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=windows-companion.trx" --results-directory .\\artifacts\\test-results

      - name: Generate XML/HTML test evidence
        if: always()
        shell: pwsh
        run: |
          $reportDir = Join-Path $PWD "artifacts/test-results"
          New-Item -ItemType Directory -Force -Path $reportDir | Out-Null
          $trxFiles = @(Get-ChildItem -Path $reportDir -Filter "*.trx" -File -ErrorAction SilentlyContinue)
          if ($trxFiles.Count -eq 0) {
            "<html><body><h1>INFINITY Windows Companion</h1><p>No TRX report was produced.</p></body></html>" |
              Set-Content -Path (Join-Path $reportDir "windows-companion-report.html") -Encoding UTF8
            exit 0
          }
          $rows = @()
          foreach ($trxFile in $trxFiles) {
            [xml]$trx = Get-Content -Raw $trxFile.FullName
            $counters = $trx.TestRun.ResultSummary.Counters
            $rows += [pscustomobject]@{
              Report = $trxFile.Name
              Total = $counters.total
              Passed = $counters.passed
              Failed = $counters.failed
              Errors = $counters.error
              Skipped = $counters.notExecuted
            }
          }
          $table = $rows | ConvertTo-Html -Fragment
          $html = "<html><head><meta charset='utf-8'><title>INFINITY Windows Companion tests</title></head><body><h1>INFINITY Windows Companion — test evidence</h1>$table</body></html>"
          $html | Set-Content -Path (Join-Path $reportDir "windows-companion-report.html") -Encoding UTF8

      - name: Upload XML/HTML test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: INFINITY-WINDOWS-TEST-REPORTS-${{ github.sha }}
          path: artifacts/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce Windows test result
        if: steps.windows_tests.outcome == 'failure'
        run: exit 1

      - name: Validate PowerShell installation scripts
        shell: pwsh
        run: |
          $scripts = @(
            ".\windows\scripts\Install-INFINITYCompanion.ps1",
            ".\windows\scripts\Uninstall-INFINITYCompanion.ps1"
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          }

      - name: Publish Windows x64 companion (self-contained)
        run: dotnet publish .\windows\Infinity.WindowsCompanion\Infinity.WindowsCompanion.csproj --configuration Release --runtime win-x64 --self-contained true --output .\artifacts\infinity-windows-companion

      - name: Publish Windows administration desktop (self-contained)
        run: dotnet publish .\windows\Infinity.WindowsCompanion.Desktop\Infinity.WindowsCompanion.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --output .\artifacts\infinity-windows-companion-desktop

      - name: Include service installation scripts and guide
        shell: pwsh
        run: |
          Copy-Item .\windows\scripts\*.ps1 .\artifacts\infinity-windows-companion\ -Force
          Copy-Item .\windows\README-INFINITY-CONNECT.md .\artifacts\infinity-windows-companion\ -Force

      - name: Upload Windows administration desktop
        uses: actions/upload-artifact@v7
        with:
          name: INFINITY-WINDOWS-COMPANION-DESKTOP-win-x64
          path: artifacts/infinity-windows-companion-desktop/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows companion
        uses: actions/upload-artifact@v7
        with:
          name: INFINITY-WINDOWS-COMPANION-win-x64
          path: artifacts/infinity-windows-companion/
          if-no-files-found: error
          retention-days: 14
