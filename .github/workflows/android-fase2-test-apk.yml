name: PROJECT INFINITY - FASE II DEBUG TEST APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infinity-fase2-debug-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-fase2-debug-test-apk:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/INFINITY-BASE-PACKAGES-01-05' }}
    name: Build and verify Fase II DEBUG test APK only
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Verify branch and immutable source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/INFINITY-BASE-PACKAGES-01-05"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git -C external/FreeRDP rev-parse HEAD)" = "65bcca1913a28cbdd7eb913599f692bd2b707991"

      - name: Configure Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Initialize Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install pinned Android build toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Verify project structure and secure manifest defaults
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/java/com/infinity/core/MainActivity.kt
          test -f app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml

      - name: Run source policy and package inventory tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_no_apk_builds.py .github/workflows
          python3 scripts/verify_no_apk_builds.py codemagic.yaml
          python3 scripts/verify_infinity_pack_inventory.py .
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
          python3 scripts/verify_android_security_manifest.py app/src/main/AndroidManifest.xml

      - name: Compile, test, lint and assemble DEBUG only
        shell: bash
        run: |
          set -euo pipefail
          gradle -PINFINITY_BUILD_FREERDP_NATIVE=true :freerdpCore:externalNativeBuildDebug compileDebugKotlin testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Verify DEBUG APK, debug certificate and ARM64 FreeRDP libraries
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "${APK}"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "${APKSIGNER}"
          "${APKSIGNER}" verify --verbose --print-certs "${APK}" | tee app-debug-signature.txt
          grep -Fq 'CN=Android Debug' app-debug-signature.txt
          APK_ENTRIES="$(unzip -Z1 "${APK}")"
          REQUIRED_FREERDP_LIBRARIES=(
            libfreerdp-android.so
            libfreerdp3.so
            libfreerdp-client3.so
            libwinpr3.so
            libssl.so
            libcrypto.so
            liburiparser.so
          )
          : > app-debug-freerdp-libraries.txt
          mkdir -p apk-native-inspection
          for library in "${REQUIRED_FREERDP_LIBRARIES[@]}"; do
            entry="lib/arm64-v8a/${library}"
            grep -Fxq "${entry}" <<< "${APK_ENTRIES}"
            extracted="apk-native-inspection/${library}"
            unzip -p "${APK}" "${entry}" > "${extracted}"
            test -s "${extracted}"
            header="$(readelf -h "${extracted}")"
            elf_class="$(printf '%s\n' "${header}" | awk -F: '/Class:/ { gsub(/^[[:space:]]+/, "", $2); print $2; exit }')"
            elf_machine="$(printf '%s\n' "${header}" | awk -F: '/Machine:/ { gsub(/^[[:space:]]+/, "", $2); print $2; exit }')"
            test "${elf_class}" = "ELF64"
            case "${elf_machine}" in AArch64*) ;; *) echo "Unexpected ELF architecture: ${elf_machine}" >&2; exit 1 ;; esac
            printf '%s class=%s machine=%s bytes=%s\n' "${entry}" "${elf_class}" "${elf_machine}" "$(stat --format='%s' "${extracted}")" | tee -a app-debug-freerdp-libraries.txt
          done
          sha256sum "${APK}" | tee app-debug-sha256.txt
          stat --format='APK_SIZE_BYTES=%s' "${APK}" | tee app-debug-size.txt

      - name: Upload DEBUG test APK and verification evidence
        uses: actions/upload-artifact@v7
        with:
          name: PROJECT-INFINITY-FASE-II-DEBUG-TEST-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug-sha256.txt
            app-debug-size.txt
            app-debug-signature.txt
            app-debug-freerdp-libraries.txt
          if-no-files-found: error
          retention-days: 7
