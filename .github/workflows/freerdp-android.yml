name: INFINITY FreeRDP Android Native Verification

on:
  push:
    branches:
      - INFINITY-PACK-14-REMOTE-FRAME-PIPELINE
    paths:
      - ".gitmodules"
      - "external/FreeRDP"
      - "external/FreeRDP/**"
      - "freerdp-core/**"
      - "app/build.gradle.kts"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/freerdp-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infinity-freerdp-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-arm64-native:
    name: Build FreeRDP native libraries (arm64-v8a; no APK)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout pinned sources
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Initialize Android SDK and accept licenses
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install required platform, NDK and CMake
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Verify pinned FreeRDP source
        run: |
          set -euo pipefail
          test -f external/FreeRDP/client/Android/Studio/freeRDPCore/src/main/cpp/CMakeLists.txt
          test "$(git -C external/FreeRDP rev-parse HEAD)" = "65bcca1913a28cbdd7eb913599f692bd2b707991"

      - name: Build native FreeRDP library only (no APK)
        run: gradle -PINFINITY_BUILD_FREERDP_NATIVE=true :freerdpCore:externalNativeBuildDebug --no-daemon --max-workers=2 --stacktrace

      - name: Verify required arm64-v8a shared libraries and ELF architecture
        shell: bash
        run: |
          set -euo pipefail
          JNI_LIBS="external/FreeRDP/client/Android/Studio/freeRDPCore/src/main/jniLibs/arm64-v8a"
          NATIVE_OUTPUT="freerdp-core/build"
          REQUIRED_LIBRARIES=(
            libfreerdp-android.so
            libfreerdp3.so
            libfreerdp-client3.so
            libwinpr3.so
            libssl.so
            libcrypto.so
            liburiparser.so
          )
          for library in "${REQUIRED_LIBRARIES[@]}"; do
            if [ "$library" = "libfreerdp-android.so" ]; then
              path="$(find "$NATIVE_OUTPUT" -type f -name "$library" -path '*/obj/arm64-v8a/*' -print -quit)"
            else
              path="$JNI_LIBS/$library"
            fi
            if [ -z "$path" ] || [ ! -s "$path" ]; then
              echo "Missing required arm64-v8a library: $library" >&2
              echo "Native CMake outputs:" >&2
              find "$NATIVE_OUTPUT" -type f -name '*.so' -path '*/obj/arm64-v8a/*' -print | sort >&2 || true
              echo "FreeRDP JNI dependency outputs:" >&2
              find "$JNI_LIBS" -maxdepth 3 -type f -name '*.so' -print | sort >&2 || true
              exit 1
            fi
            header="$(readelf -h "$path")"
            elf_class="$(printf '%s\n' "$header" | awk -F: '/Class:/ { gsub(/^[[:space:]]+/, "", $2); print $2; exit }')"
            elf_machine="$(printf '%s\n' "$header" | awk -F: '/Machine:/ { gsub(/^[[:space:]]+/, "", $2); print $2; exit }')"
            printf '%s: %s class=%s machine=%s\n' "$library" "$path" "$elf_class" "$elf_machine"
            test "$elf_class" = "ELF64"
            case "$elf_machine" in AArch64*) ;; *) echo "Unexpected ELF architecture for $library: $elf_machine" >&2; exit 1 ;; esac
          done
