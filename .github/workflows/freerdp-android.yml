name: INFINITY FreeRDP Android Native Verification

on:
  push:
    branches:
      - INFINITY-PACK-14-REMOTE-FRAME-PIPELINE
    paths:
      - ".gitmodules"
      - "external/FreeRDP"
      - "external/FreeRDP/**"
      - "freerdp-core/**"
      - "app/build.gradle.kts"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/freerdp-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infinity-freerdp-native-${{ github.sha }}
  cancel-in-progress: false

jobs:
  android-arm64-native:
    name: Build FreeRDP native libraries (arm64-v8a; no APK)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout pinned sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Initialize Android SDK and accept licenses
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install required platform, NDK and CMake
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify pinned FreeRDP source
        run: |
          set -euo pipefail
          test -f external/FreeRDP/client/Android/Studio/freeRDPCore/src/main/cpp/CMakeLists.txt
          test "$(git -C external/FreeRDP rev-parse HEAD)" = "65bcca1913a28cbdd7eb913599f692bd2b707991"

      - name: Build native FreeRDP library only (no APK)
        run: gradle -PINFINITY_BUILD_FREERDP_NATIVE=true :freerdpCore:externalNativeBuildDebug --no-daemon --max-workers=2 --stacktrace

      - name: Verify required arm64-v8a shared libraries
        shell: bash
        run: |
          set -euo pipefail
          JNI_LIBS="external/FreeRDP/client/Android/Studio/freeRDPCore/src/main/jniLibs/arm64-v8a"
          for library in libfreerdp3.so libfreerdp-client3.so libwinpr3.so libssl.so libcrypto.so liburiparser.so; do
            test -s "$JNI_LIBS/$library"
            ls -lh "$JNI_LIBS/$library"
          done
          ANDROID_JNI="$(find freerdp-core external/FreeRDP/client/Android/Studio/freeRDPCore/src/main/jniLibs -type f -name 'libfreerdp-android.so' -print -quit)"
          test -n "$ANDROID_JNI"
          ls -lh "$ANDROID_JNI"
