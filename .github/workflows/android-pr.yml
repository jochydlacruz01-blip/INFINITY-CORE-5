name: PROJECT INFINITY - Pull Request Verification

on:
  pull_request:
    branches:
      - INFINITY-0.9
      - INFINITY-AURORA-NEXT-INTEGRATED
      - INFINITY-PACK-01-FILES-REVIEWED
      - INFINITY-PACK-02-ORBIT-WORKSPACES
      - INFINITY-PACK-03-DOCK-RESPONSIVE
      - INFINITY-PACK-04-START-CATALOG
      - INFINITY-PACK-05-AURORA-WINDOWS
      - INFINITY-PACK-06-CONNECT-SECURITY
      - INFINITY-PACK-07-CONTROL-CENTER
      - INFINITY-PACK-08-ORBIT-SPACES
      - INFINITY-PACK-09-SECURITY-AUDIT
      - INFINITY-PACK-10-FINAL-INTEGRATION
      - INFINITY-PACK-11-SECURE-PAIRING
      - INFINITY-PACK-12-WINDOWS-COMPANION
      - INFINITY-PACK-13-FUTURISTIC-DESKTOP-VISUAL
      - INFINITY-PACK-14-REMOTE-FRAME-PIPELINE
  push:
    branches:
      - INFINITY-0.11-VIRTUAL-DESKTOPS
      - INFINITY-PACK-01-FILES-REVIEWED
      - INFINITY-PACK-02-ORBIT-WORKSPACES
      - INFINITY-PACK-03-DOCK-RESPONSIVE
      - INFINITY-PACK-04-START-CATALOG
      - INFINITY-PACK-05-AURORA-WINDOWS
      - INFINITY-PACK-06-CONNECT-SECURITY
      - INFINITY-PACK-07-CONTROL-CENTER
      - INFINITY-PACK-08-ORBIT-SPACES
      - INFINITY-PACK-09-SECURITY-AUDIT
      - INFINITY-PACK-10-FINAL-INTEGRATION
      - INFINITY-PACK-11-SECURE-PAIRING
      - INFINITY-PACK-12-WINDOWS-COMPANION
      - INFINITY-PACK-13-FUTURISTIC-DESKTOP-VISUAL
    paths:
      - "app/**"
      - "freerdp-core/**"
      - "external/FreeRDP/**"
      - "scripts/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".gitmodules"
      - "codemagic.yaml"
      - ".github/workflows/android.yml"
      - ".github/workflows/android-pr.yml"
      - ".github/workflows/freerdp-android.yml"
  workflow_dispatch:
    inputs:
      instrumentation_test:
        description: "Instrumented test to run on the Android 14 emulator"
        required: true
        type: choice
        default: all
        options:
          - orbitMinimizeAllOnlyAffectsTheActiveWorkspace
          - exerciseDesktopCaptureRealScreensAcrossOrientations
          - all
          - process-persistence

permissions:
  contents: read

concurrency:
  # Each dispatch/push is isolated so independent verification sends can run concurrently.
  group: infinity-pr-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source (unit tests and lint only; no APK)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Verify project structure and security defaults
        run: |
          set -eu
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/java/com/infinity/core/MainActivity.kt
          test -f app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml

      - name: Enforce source-only development policy
        run: |
          set -euo pipefail
          python3 scripts/verify_no_apk_builds.py .github/workflows
          python3 scripts/verify_no_apk_builds.py codemagic.yaml

      - name: Verify integrated INFINITY package inventory
        run: |
          set -euo pipefail
          python3 scripts/verify_infinity_pack_inventory.py .
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Audit Android manifest security boundaries
        run: |
          set -euo pipefail
          python3 scripts/verify_android_security_manifest.py app/src/main/AndroidManifest.xml
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Run source compilation and unit tests (no APK)
        run: gradle compileDebugKotlin compileDebugAndroidTestKotlin testDebugUnitTest testReleaseUnitTest --stacktrace

      - name: Verify pinned FreeRDP source revision
        run: |
          set -euo pipefail
          test -f external/FreeRDP/client/Android/Studio/freeRDPCore/src/main/cpp/CMakeLists.txt
          test "$(git -C external/FreeRDP rev-parse HEAD)" = "65bcca1913a28cbdd7eb913599f692bd2b707991"

      - name: Run Android lint (no APK)
        run: gradle lintDebug lintRelease --stacktrace

      - name: Preserve Android unit test reports (no APK)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: INFINITY-ANDROID-TEST-REPORTS-${{ github.sha }}
          path: |
            app/build/test-results/**
            app/build/reports/tests/**
            app/build/reports/lint-results*.html
            freerdp-core/build/reports/lint-results*.html
          if-no-files-found: warn
          retention-days: 14

  emulator-ui:
    # Run phone/tablet acceptance only after development is complete and explicitly dispatched.
    if: github.event_name == 'workflow_dispatch' && inputs.instrumentation_test != 'process-persistence' # Full phone/tablet acceptance remains deferred.
    # Final emulator validation runs only after source, unit-test and lint gates pass.
    name: Instrumented Android UI (${{ matrix.device }})
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      # Avoid simultaneous emulator jobs flooding Maven Central with identical UTP dependencies.
      max-parallel: 1
      matrix:
        include:
          - device: tablet
            profile: pixel_tablet
          - device: compact-phone
            profile: pixel_2
    steps:
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Run real app on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          force-avd-creation: true
          emulator-boot-timeout: 900
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          # Keep the runner's maintained emulator flags; custom camera options can prevent AVD boot.
          # Keep this as one command: android-emulator-runner invokes its script through sh -c.
          # Capture the real test exit code and preserve screenshots without masking failures.
          script: >-
            set -u; evidence="artifacts/emulator-screenshots/${{ matrix.device }}"; mkdir -p "$evidence"; adb devices -l > "$evidence/adb-before.txt" 2>&1 || true; adb wait-for-device; booted=0; for attempt in $(seq 1 90); do if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\\r')" = "1" ]; then booted=1; break; fi; sleep 2; done; if [ "$booted" -ne 1 ]; then echo "Emulator did not report sys.boot_completed=1." > "$evidence/emulator-boot-failure.txt"; adb devices -l >> "$evidence/emulator-boot-failure.txt" 2>&1 || true; exit 70; fi; adb shell getprop > "$evidence/device-properties.txt" 2>&1 || true; test_exit=0; if [ "${{ github.event_name }}" = "pull_request" ]; then for test_name in dockFavoriteCanBePinnedAndPersistsAcrossActivityRecreation exerciseDesktopCaptureRealScreensAcrossOrientations advancedPanelSurvivesRotationAndAndroidSettingsRoundTrips automationConsentRevocationPersistsAndDisablesExecution advancedQuickActionsReturnToInfinityAfterSettingsHandoff notificationAccessSettingsRefreshAndFeedSurvivesActivityRecreation notificationDismissActionRespectsAndroidClearability notificationPrivacyRedactsExistingAndFutureContent workspaceNamesBackgroundsShortcutsWindowsAndActiveSpaceSurviveActivityRecreation; do gradle connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.infinity.core.InfinityDesktopEmulatorTest#"$test_name" --stacktrace || { test_exit=$?; break; }; done; if [ "$test_exit" -eq 0 ]; then gradle connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.infinity.core.InfinityAndroidApplicationLauncherInstrumentedTest --stacktrace || test_exit=$?; fi; else case "${{ inputs.instrumentation_test || 'all' }}" in all) gradle connectedDebugAndroidTest --stacktrace ;; *) gradle connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.infinity.core.InfinityDesktopEmulatorTest#${{ inputs.instrumentation_test }} --stacktrace ;; esac; test_exit=$?; fi; adb devices -l > "$evidence/adb-after.txt" 2>&1 || true; adb logcat -d -v threadtime ComposeTest:D INFINITY_DEBUG:D INFINITY_TEST_DIAGNOSTIC:D AndroidRuntime:E '*:S' > "$evidence/logcat-diagnostics.txt" 2>&1 || echo "ADB/logcat unavailable after test execution." >> "$evidence/logcat-diagnostics.txt"; export_exit=0; if adb shell test -d /sdcard/Pictures/infinity-ui-captures; then if adb pull /sdcard/Pictures/infinity-ui-captures "$evidence/"; then echo "Shared MediaStore screenshots exported." >> "$evidence/logcat-diagnostics.txt"; else echo "Failed to pull shared MediaStore screenshots." >> "$evidence/logcat-diagnostics.txt"; export_exit=1; fi; else echo "Shared MediaStore screenshot directory was not created." >> "$evidence/logcat-diagnostics.txt"; fi; if [ "$test_exit" -ne 0 ]; then exit "$test_exit"; fi; exit "$export_exit"

      - name: Upload real emulator screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: INFINITY-EMULATOR-SCREENSHOTS-${{ matrix.device }}-${{ github.sha }}
          path: artifacts/emulator-screenshots/
          if-no-files-found: warn
          retention-days: 1

  process-persistence:
    # Dedicated single-emulator process-death acceptance; this does not run tablet/phone layout simulations.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.instrumentation_test == 'process-persistence')
    name: Real Android process persistence (single emulator)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Seed, force-stop, relaunch and verify a new app process
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-boot-timeout: 900
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          script: |
            set -euo pipefail
            package="com.infinity.core"
            test_class="com.infinity.core.InfinityProcessPersistenceInstrumentedTest"
            mkdir -p artifacts/test-results
            if ! gradle connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class="$test_class#seedThreeWorkspaceStateBeforeHostForceStop" --stacktrace > artifacts/test-results/seed-instrumentation.log 2>&1; then cat artifacts/test-results/seed-instrumentation.log; exit 1; fi
            cat artifacts/test-results/seed-instrumentation.log
            adb shell am start -n "$package/.MainActivity"
            if ! gradle connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class="$test_class#captureStateAfterInitialAppLaunch" --stacktrace > artifacts/test-results/capture-instrumentation.log 2>&1; then cat artifacts/test-results/capture-instrumentation.log; exit 1; fi
            cat artifacts/test-results/capture-instrumentation.log
            before_pid=""
            for attempt in $(seq 1 60); do
              before_pid="$(adb shell pidof "$package" 2>/dev/null | tr -d '\r' || true)"
              if [ -n "$before_pid" ]; then break; fi
              sleep 1
            done
            test -n "$before_pid"
            echo "Original app PID: $before_pid" | tee artifacts/test-results/process-lifecycle.txt
            adb shell am force-stop "$package"
            stopped=0
            for attempt in $(seq 1 30); do
              current_pid="$(adb shell pidof "$package" 2>/dev/null | tr -d '\r' || true)"
              if [ -z "$current_pid" ]; then stopped=1; break; fi
              sleep 1
            done
            test "$stopped" -eq 1
            echo "ActivityManager confirmed the original app process stopped." | tee -a artifacts/test-results/process-lifecycle.txt
            adb shell am start -n "$package/.MainActivity"
            after_pid=""
            for attempt in $(seq 1 60); do
              after_pid="$(adb shell pidof "$package" 2>/dev/null | tr -d '\r' || true)"
              if [ -n "$after_pid" ]; then break; fi
              sleep 1
            done
            test -n "$after_pid"
            test "$before_pid" != "$after_pid"
            echo "Fresh app PID: $after_pid" | tee -a artifacts/test-results/process-lifecycle.txt
            if ! gradle connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class="$test_class#verifyStateAfterHostPerformedProcessRestart" --stacktrace > artifacts/test-results/verify-instrumentation.log 2>&1; then cat artifacts/test-results/verify-instrumentation.log; exit 1; fi
            cat artifacts/test-results/verify-instrumentation.log
            adb logcat -d -v threadtime AndroidRuntime:E INFINITY_WINDOW_RECOVERY:W '*:S' > artifacts/test-results/process-persistence-logcat.txt 2>&1 || true

      - name: Preserve process-persistence evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: INFINITY-PROCESS-PERSISTENCE-${{ github.sha }}
          path: artifacts/test-results/**
          if-no-files-found: warn
          retention-days: 14
