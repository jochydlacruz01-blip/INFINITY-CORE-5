name: PROJECT INFINITY - Pull Request Verification

on:
  pull_request:
    branches:
      - INFINITY-0.9
      - INFINITY-PACK-01-FILES-REVIEWED
      - INFINITY-PACK-02-ORBIT-WORKSPACES
      - INFINITY-PACK-03-DOCK-RESPONSIVE
      - INFINITY-PACK-04-START-CATALOG
      - INFINITY-PACK-05-AURORA-WINDOWS
      - INFINITY-PACK-06-CONNECT-SECURITY
      - INFINITY-PACK-07-CONTROL-CENTER
      - INFINITY-PACK-08-ORBIT-SPACES
      - INFINITY-PACK-09-SECURITY-AUDIT
      - INFINITY-PACK-10-FINAL-INTEGRATION
      - INFINITY-PACK-11-SECURE-PAIRING
      - INFINITY-PACK-12-WINDOWS-COMPANION
      - INFINITY-PACK-13-FUTURISTIC-DESKTOP-VISUAL
      - INFINITY-PACK-14-REMOTE-FRAME-PIPELINE
  push:
    branches:
      - INFINITY-AURORA-NEXT-INTEGRATED
      - INFINITY-PACK-01-FILES-REVIEWED
      - INFINITY-PACK-02-ORBIT-WORKSPACES
      - INFINITY-PACK-03-DOCK-RESPONSIVE
      - INFINITY-PACK-04-START-CATALOG
      - INFINITY-PACK-05-AURORA-WINDOWS
      - INFINITY-PACK-06-CONNECT-SECURITY
      - INFINITY-PACK-07-CONTROL-CENTER
      - INFINITY-PACK-08-ORBIT-SPACES
      - INFINITY-PACK-09-SECURITY-AUDIT
      - INFINITY-PACK-10-FINAL-INTEGRATION
      - INFINITY-PACK-11-SECURE-PAIRING
      - INFINITY-PACK-12-WINDOWS-COMPANION
      - INFINITY-PACK-13-FUTURISTIC-DESKTOP-VISUAL
      - INFINITY-PACK-14-REMOTE-FRAME-PIPELINE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infinity-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source (unit tests and lint only; no APK)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project structure and security defaults
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/java/com/infinity/core/MainActivity.kt
          test -f app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml

      - name: Enforce source-only development policy
        run: |
          set -euo pipefail
          python3 scripts/verify_no_apk_builds.py .github/workflows/android-pr.yml

      - name: Verify integrated INFINITY package inventory
        run: |
          set -euo pipefail
          python3 scripts/verify_infinity_pack_inventory.py .
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Audit Android manifest security boundaries
        run: |
          set -euo pipefail
          python3 scripts/verify_android_security_manifest.py app/src/main/AndroidManifest.xml
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Run source compilation and unit tests (no APK)
        run: gradle compileDebugKotlin testDebugUnitTest testReleaseUnitTest --stacktrace

      - name: Detect FreeRDP native source changes
        id: freerdp-changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          if git diff --name-only "$BASE_SHA"...HEAD | grep -Eq '^(freerdp-core/|external/FreeRDP/|\\.gitmodules$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and verify FreeRDP native libraries (no APK)
        if: steps.freedrp-changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          gradle -PINFINITY_BUILD_FREERDP_NATIVE=true :freerdpCore:externalNativeBuildDebug --no-daemon --max-workers=2 --stacktrace
          JNI_LIBS="external/FreeRDP/client/Android/Studio/freeRDPCore/src/main/jniLibs/arm64-v8a"
          for library in libfreerdp3.so libfreerdp-client3.so libwinpr3.so libssl.so libcrypto.so liburiparser.so; do
            test -s "$JNI_LIBS/$library"
          done
          ANDROID_JNI="$(find freerdp-core external/FreeRDP -type f -name 'libfreerdp-android.so' -print -quit)"
          test -n "$ANDROID_JNI"
          ls -lh "$ANDROID_JNI"

      - name: Run Android lint (no APK)
        run: gradle lintDebug lintRelease --stacktrace

