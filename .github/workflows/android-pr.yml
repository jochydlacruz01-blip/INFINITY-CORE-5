name: PROJECT INFINITY - Pull Request Verification

on:
  pull_request:
    branches:
      - INFINITY-0.9
  push:
    branches:
      - INFINITY-AURORA-NEXT-INTEGRATED

permissions:
  contents: read

concurrency:
  group: infinity-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify PR (Debug, Lint, Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project structure
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/java/com/infinity/core/MainActivity.kt
          test -f app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml

      - name: Run Debug and Release unit tests
        run: gradle testDebugUnitTest testReleaseUnitTest --stacktrace

      - name: Run Android lint for Debug and Release
        run: gradle lintDebug lintRelease --stacktrace

      - name: Build Debug and Release APKs
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Upload pull request APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: INFINITY-APKS-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 5
