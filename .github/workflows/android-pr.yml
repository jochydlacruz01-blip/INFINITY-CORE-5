name: PROJECT INFINITY - Source Verification (no APK)

on:
  pull_request:
    branches:
      - INFINITY-PACK-06-CONNECT-SECURITY
      - INFINITY-PACK-07-CONTROL-CENTER
      - INFINITY-PACK-08-ORBIT-SPACES
      - INFINITY-PACK-09-SECURITY-AUDIT
      - INFINITY-PACK-10-FINAL-INTEGRATION
      - INFINITY-PACK-11-SECURE-PAIRING
      - INFINITY-PACK-12-WINDOWS-COMPANION
      - INFINITY-PACK-13-FUTURISTIC-DESKTOP-VISUAL
      - INFINITY-PACK-14-REMOTE-FRAME-PIPELINE
  push:
    branches:
      - INFINITY-PACK-07-CONTROL-CENTER
      - INFINITY-PACK-08-ORBIT-SPACES
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infinity-source-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source (tests and lint only; no APK)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android project and secure defaults
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
      - name: Compile source, run unit tests, and lint (no APK)
        run: gradle compileDebugKotlin testDebugUnitTest testReleaseUnitTest lintDebug lintRelease --stacktrace
