name: PROJECT INFINITY - Nightly Quality Check

on:
  schedule:
    # 02:17 Dominican Republic time (UTC-4)
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infinity-nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify INFINITY-0.9
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout INFINITY-0.9
        uses: actions/checkout@v4
        with:
          ref: INFINITY-0.9

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project structure
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/java/com/infinity/core/MainActivity.kt
          test -f app/src/main/java/com/infinity/core/InfinityConnect.kt
          test -f app/src/main/java/com/infinity/core/OrbitSystemMonitor.kt

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: gradle lintDebug --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Save nightly verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: INFINITY-NIGHTLY-REPORTS-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 3

      - name: Save verified debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: INFINITY-NIGHTLY-DEBUG-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
