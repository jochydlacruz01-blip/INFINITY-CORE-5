name: PROJECT INFINITY 0.10 - RELEASE VALIDATION APK (EPHEMERAL SIGNING)

on:
  workflow_dispatch:
  push:
    branches:
      - INFINITY-PACK-14-REMOTE-FRAME-PIPELINE
    paths:
      - '.github/workflows/android-validation-release.yml'

permissions:
  contents: read

concurrency:
  group: infinity-release-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release-validation:
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/INFINITY-PACK-14-REMOTE-FRAME-PIPELINE' }}
    name: Build and verify ephemeral-signed Release validation APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout authorized PR #87 branch
        uses: actions/checkout@v7
        with:
          ref: INFINITY-PACK-14-REMOTE-FRAME-PIPELINE
          submodules: recursive
          persist-credentials: false

      - name: Verify checked-out branch and commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "INFINITY-PACK-14-REMOTE-FRAME-PIPELINE"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "Validated source ref: ${GITHUB_REF}"
          echo "Validated source SHA: ${GITHUB_SHA}"

      - name: Configure Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Initialize Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install required Android platform, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Generate a short-lived validation-only signing identity
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="${RUNNER_TEMP}/infinity-validation-only.jks"
          STORE_PASSWORD="$(openssl rand -hex 32)"
          KEY_PASSWORD="$(openssl rand -hex 32)"
          keytool -genkeypair -noprompt \
            -keystore "${KEYSTORE}" \
            -storetype JKS \
            -storepass "${STORE_PASSWORD}" \
            -keypass "${KEY_PASSWORD}" \
            -alias infinity-validation-only \
            -keyalg RSA -keysize 3072 -validity 2 \
            -dname "CN=INFINITY VALIDATION ONLY, OU=QA, O=PROJECT INFINITY, C=DO"
          chmod 600 "${KEYSTORE}"
          {
            echo "INFINITY_KEYSTORE_FILE=${KEYSTORE}"
            echo "INFINITY_KEYSTORE_PASSWORD=${STORE_PASSWORD}"
            echo "INFINITY_KEY_ALIAS=infinity-validation-only"
            echo "INFINITY_KEY_PASSWORD=${KEY_PASSWORD}"
          } >> "${GITHUB_ENV}"

      - name: Compile, test, lint and assemble Release with native FreeRDP
        shell: bash
        run: |
          set -euo pipefail
          test -s "${INFINITY_KEYSTORE_FILE}"
          VALIDATION_EXPIRES_AT="$(date -u -d '+48 hours' +%s)"
          gradle -PINFINITY_BUILD_FREERDP_NATIVE=true \
            -PINFINITY_REMOTE_ACCEPTANCE_BUILD=true \
            -PINFINITY_REMOTE_ACCEPTANCE_EXPIRES_AT_EPOCH="${VALIDATION_EXPIRES_AT}" \
            :freerdpCore:externalNativeBuildRelease \
            compileReleaseKotlin testReleaseUnitTest lintRelease assembleRelease --stacktrace

      - name: Verify Release APK signature, identity and native libraries
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "${APK}"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "${ANDROID_HOME}/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -n "${APKSIGNER}"
          test -n "${ZIPALIGN}"
          "${APKSIGNER}" verify --verbose --print-certs "${APK}" | tee release-validation-signature.txt
          grep -Fq 'CN=INFINITY VALIDATION ONLY' release-validation-signature.txt
          "${ZIPALIGN}" -c -v 4 "${APK}"
          APK_ENTRIES="$(unzip -Z1 "${APK}")"
          REQUIRED_FREERDP_LIBRARIES=(
            libfreerdp-android.so
            libfreerdp3.so
            libfreerdp-client3.so
            libwinpr3.so
            libssl.so
            libcrypto.so
            liburiparser.so
          )
          : > release-validation-native-libraries.txt
          mkdir -p release-native-inspection
          for library in "${REQUIRED_FREERDP_LIBRARIES[@]}"; do
            entry="lib/arm64-v8a/${library}"
            grep -Fxq "${entry}" <<< "${APK_ENTRIES}"
            extracted="release-native-inspection/${library}"
            unzip -p "${APK}" "${entry}" > "${extracted}"
            test -s "${extracted}"
            header="$(readelf -h "${extracted}")"
            elf_class="$(printf '%s\n' "${header}" | awk -F: '/Class:/ { gsub(/^[[:space:]]+/, "", $2); print $2; exit }')"
            elf_machine="$(printf '%s\n' "${header}" | awk -F: '/Machine:/ { gsub(/^[[:space:]]+/, "", $2); print $2; exit }')"
            test "${elf_class}" = "ELF64"
            case "${elf_machine}" in AArch64*) ;; *) echo "Unexpected ELF architecture: ${elf_machine}" >&2; exit 1 ;; esac
            printf '%s class=%s machine=%s bytes=%s\n' "${entry}" "${elf_class}" "${elf_machine}" "$(stat --format='%s' "${extracted}")" | tee -a release-validation-native-libraries.txt
          done
          sha256sum "${APK}" | tee release-validation-sha256.txt
          stat --format='APK_SIZE_BYTES=%s' "${APK}" | tee release-validation-size.txt
          keytool -list -v -keystore "${INFINITY_KEYSTORE_FILE}" -storepass "${INFINITY_KEYSTORE_PASSWORD}" -alias "${INFINITY_KEY_ALIAS}" > release-validation-certificate.txt
          grep -Fq 'CN=INFINITY VALIDATION ONLY' release-validation-certificate.txt

      - name: Upload Release validation APK and verification evidence (not a GitHub Release)
        uses: actions/upload-artifact@v7
        with:
          name: PROJECT-INFINITY-0.10-RELEASE-VALIDATION-APK
          path: |
            app/build/outputs/apk/release/app-release.apk
            release-validation-signature.txt
            release-validation-sha256.txt
            release-validation-size.txt
            release-validation-native-libraries.txt
            release-validation-certificate.txt
          if-no-files-found: error
          retention-days: 7
