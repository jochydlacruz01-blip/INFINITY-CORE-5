name: PROJECT INFINITY 0.10 - APK BUILD

on:
  # APK creation is intentionally manual until the user authorizes a build.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infinity-android-build-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: PROJECT-INFINITY-0.10-APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar estructura
        run: |
          echo "Verificando PROJECT INFINITY 0.10..."
          ls -la
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/java/com/infinity/core/MainActivity.kt
          test -f app/src/main/java/com/infinity/core/InfinityConnect.kt
          test -f app/src/main/java/com/infinity/core/OrbitSystemMonitor.kt
          test -f app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.BIND_NOTIFICATION_LISTENER_SERVICE' app/src/main/AndroidManifest.xml

      - name: Preparar firma
        env:
          INFINITY_KEYSTORE_BASE64: ${{ secrets.INFINITY_KEYSTORE_BASE64 }}
        run: |
          test -n "$INFINITY_KEYSTORE_BASE64"
          printf '%s' "$INFINITY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/infinity-release.jks"
          test -s "$RUNNER_TEMP/infinity-release.jks"

      - name: Compilar APK Debug y Release firmado
        env:
          INFINITY_KEYSTORE_FILE: ${{ runner.temp }}/infinity-release.jks
          INFINITY_KEYSTORE_PASSWORD: ${{ secrets.INFINITY_KEYSTORE_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
          INFINITY_KEY_PASSWORD: ${{ secrets.INFINITY_KEY_PASSWORD }}
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Auditoría estática Debug y Release y pruebas unitarias
        run: gradle lintDebug lintRelease testDebugUnitTest testReleaseUnitTest --stacktrace

      - name: Verificar firma del APK Release
        shell: bash
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Publicar APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT-INFINITY-0.10-DEBUG-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Preparar paquete de distribución y checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/PROJECT-INFINITY-0.10.0
          cp app/build/outputs/apk/debug/app-debug.apk dist/PROJECT-INFINITY-0.10.0/PROJECT-INFINITY-0.10.0-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/PROJECT-INFINITY-0.10.0/PROJECT-INFINITY-0.10.0-release-signed.apk
          VERSION_NAME="$(awk -F\" '/versionName/{print $2; exit}' app/build.gradle.kts | tr -d \"\")"
          VERSION_CODE="$(awk '/versionCode/ {print $NF; exit}' app/build.gradle.kts)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          {
            echo "Project: PROJECT INFINITY"
            echo "Version: $VERSION_NAME"
            echo "Version code: $VERSION_CODE"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Workflow run: ${GITHUB_RUN_ID}"
            echo "Release APK: signed and verified with apksigner"
          } > dist/PROJECT-INFINITY-0.10.0/BUILD-INFO.txt
          cd dist/PROJECT-INFINITY-0.10.0
          sha256sum *.apk BUILD-INFO.txt > SHA256SUMS.txt
          test -s SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Publicar paquete de distribución
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT-INFINITY-0.10.0-DISTRIBUTION-BUNDLE
          path: dist/PROJECT-INFINITY-0.10.0/
          if-no-files-found: error
          retention-days: 30

      - name: Publicar APK Release firmado
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT-INFINITY-0.10-RELEASE-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
