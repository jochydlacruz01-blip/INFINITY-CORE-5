name: INFINITY CORE 0.7 - AURORA BUILD

on:
  push:
    branches:
      - INFINITY-0.7

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build INFINITY APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar archivos
        run: |
          ls -la
          find . -maxdepth 3 -name "build.gradle*" -o -name "settings.gradle*"

      - name: Compilar APK
        run: gradle assembleDebug --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: INFINITY-AURORA-0.7-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
