name: PROJECT INFINITY 0.9 - APK BUILD

on:
  push:
    branches:
      - INFINITY-0.9

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PROJECT INFINITY 0.9
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar estructura
        run: |
          echo "Verificando proyecto INFINITY 0.9..."
          ls -la
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/java/com/infinity/core/MainActivity.kt
          test -f app/src/main/java/com/infinity/core/InfinityConnect.kt

      - name: Compilar APK
        run: gradle assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT-INFINITY-0.9-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
