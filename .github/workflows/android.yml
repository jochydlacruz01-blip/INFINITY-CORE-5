name: INFINITY 0.8 - AURORA NEXT BUILD

on:
  push:
    branches:
      - INFINITY-0.8

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build INFINITY 0.8 APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Revisar estructura del proyecto
        run: |
          echo "Verificando archivos..."
          ls -la
          find . -maxdepth 3 \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" \)

      - name: Compilar APK
        run: gradle assembleDebug --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: INFINITY-AURORA-0.8-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
