name: PROJECT INFINITY 0.10 - DEBUG TEST APK

on:
  workflow_dispatch:
  push:
    branches:
      - INFINITY-PACK-14-REMOTE-FRAME-PIPELINE

permissions:
  contents: read

jobs:
  build-debug-test-apk:
    name: Build and verify DEBUG test APK only
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout current PR branch and pinned submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Configure Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Verify project structure and secure manifest defaults
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/java/com/infinity/core/MainActivity.kt
          test -f app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
      - name: Compile, test, lint, and assemble DEBUG only
        run: gradle compileDebugKotlin testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Verify DEBUG APK exists and is signed with the Android debug key
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK" | tee app-debug-sha256.txt
      - name: Upload DEBUG test APK
        uses: actions/upload-artifact@v7
        with:
          name: PROJECT-INFINITY-0.10-DEBUG-TEST-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload APK checksum
        uses: actions/upload-artifact@v7
        with:
          name: PROJECT-INFINITY-0.10-DEBUG-APK-CHECKSUM
          path: app-debug-sha256.txt
          if-no-files-found: error
          retention-days: 14
