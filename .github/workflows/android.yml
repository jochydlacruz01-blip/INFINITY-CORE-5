name: PROJECT INFINITY 0.10 - DEBUG TEST APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infinity-debug-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-debug-test-apk:
    # Manual dispatch is allowed only when the selected ref is the authorized PR #87 branch.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/INFINITY-PACK-14-REMOTE-FRAME-PIPELINE' }}
    name: Build and verify DEBUG test APK only
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout authorized PR #87 branch
        uses: actions/checkout@v7
        with:
          ref: INFINITY-PACK-14-REMOTE-FRAME-PIPELINE
          submodules: recursive
          persist-credentials: false

      - name: Verify checked-out branch and commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "INFINITY-PACK-14-REMOTE-FRAME-PIPELINE"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "Validated source ref: ${GITHUB_REF}"
          echo "Validated source SHA: ${GITHUB_SHA}"

      - name: Configure Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Verify project structure and secure manifest defaults
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/java/com/infinity/core/MainActivity.kt
          test -f app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml

      - name: Compile, test, lint, and assemble DEBUG only
        shell: bash
        run: |
          set -euo pipefail
          gradle compileDebugKotlin testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Verify DEBUG APK and Android debug certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "${APK}"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "${APKSIGNER}"
          "${APKSIGNER}" verify --verbose --print-certs "${APK}" | tee app-debug-signature.txt
          grep -Fq 'CN=Android Debug' app-debug-signature.txt
          sha256sum "${APK}" | tee app-debug-sha256.txt
          stat --format='APK_SIZE_BYTES=%s' "${APK}" | tee app-debug-size.txt

      - name: Upload DEBUG test APK
        uses: actions/upload-artifact@v7
        with:
          name: PROJECT-INFINITY-0.10-DEBUG-TEST-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload DEBUG APK verification evidence
        uses: actions/upload-artifact@v7
        with:
          name: PROJECT-INFINITY-0.10-DEBUG-APK-EVIDENCE
          path: |
            app-debug-sha256.txt
            app-debug-size.txt
            app-debug-signature.txt
          if-no-files-found: error
          retention-days: 14
